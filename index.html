<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Vật Phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            color: #333;
        }
        .auth-section button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .auth-section button.logout {
            background-color: #dc3545;
        }
        form {
            display: none; /* Mặc định ẩn form thêm hàng đối với khách */
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        form.active {
            display: flex;
        }
        input, button {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form input {
            flex: 1;
            min-width: 140px;
        }
        .file-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .file-input-group label {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }
        form button[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }
        form button[type="submit"]:hover {
            background-color: #0056b3;
        }
        .search-box {
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background-color: #f8f9fa;
        }
        .item-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: none; /* Mặc định ẩn nút xóa */
        }
        .admin-mode .btn-delete {
            display: inline-block; /* Chỉ hiện khi là quản lý */
        }
        .admin-badge {
            font-size: 12px;
            color: #28a745;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Quản Lý Vật Phẩm & Vị Trí Kệ <span id="adminBadge" class="admin-badge"></span></h2>
        <div class="auth-section">
            <button id="authBtn" onclick="toggleAuth()">Đăng nhập quản lý</button>
        </div>
    </div>
    
    <!-- Form thêm vật phẩm (Chỉ hiện khi đăng nhập quản lý) -->
    <form id="itemForm">
        <input type="text" id="itemCode" placeholder="Mã hàng..." required>
        <input type="text" id="itemName" placeholder="Tên vật phẩm..." required>
        <input type="text" id="itemShelf" placeholder="Vị trí kệ..." required>
        <input type="number" id="itemQuantity" placeholder="Số lượng..." min="1" required>
        
        <div class="file-input-group">
            <label for="itemImage">Chọn ảnh vật phẩm:</label>
            <input type="file" id="itemImage" accept="image/*" required>
        </div>
        
        <button type="submit">Thêm Vật Phẩm</button>
    </form>

    <!-- Ô tìm kiếm -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Tìm kiếm theo mã hàng, tên vật phẩm hoặc vị trí kệ...">

    <!-- Bảng hiển thị -->
    <table id="itemTable">
        <thead>
            <tr>
                <th>Hình ảnh</th>
                <th>Mã hàng</th>
                <th>Tên Vật Phẩm</th>
                <th>Vị Trí Kệ</th>
                <th>Số lượng</th>
                <th id="actionHeader" style="display: none;">Hành động</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dữ liệu sẽ được render tự động qua JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Kiểm tra trạng thái đăng nhập từ sessionStorage (mật khẩu mặc định: admin123)
    let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

    // Khởi tạo danh sách vật phẩm từ localStorage
    let items = JSON.parse(localStorage.getItem('items')) || [];

    // Cập nhật giao diện theo quyền
    function updateAuthUI() {
        const form = document.getElementById('itemForm');
        const authBtn = document.getElementById('authBtn');
        const actionHeader = document.getElementById('actionHeader');
        const adminBadge = document.getElementById('adminBadge');
        const tableContainer = document.getElementById('itemTable');

        if (isAdmin) {
            form.classList.add('active');
            authBtn.textContent = 'Đăng xuất';
            authBtn.className = 'logout';
            actionHeader.style.display = 'table-cell';
            adminBadge.textContent = '(Chế độ Quản lý)';
            tableContainer.classList.add('admin-mode');
        } else {
            form.classList.remove('active');
            authBtn.textContent = 'Đăng nhập quản lý';
            authBtn.className = '';
            actionHeader.style.display = 'none';
            adminBadge.textContent = '';
            tableContainer.classList.remove('admin-mode');
        }
        renderTable();
    }

    // Xử lý đăng nhập / đăng xuất
    function toggleAuth() {
        if (isAdmin) {
            isAdmin = false;
            sessionStorage.setItem('isAdmin', 'false');
            updateAuthUI();
        } else {
            let password = prompt('Nhập mật khẩu quản lý:');
            if (password === 'admin123') { // Bạn có thể đổi mật khẩu tại đây
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                alert('Đăng nhập thành công!');
                updateAuthUI();
            } else if (password !== null) {
                alert('Sai mật khẩu!');
            }
        }
    }

    // Hàm render danh sách ra bảng
    function renderTable(data = items) {
        const tableBody = document.querySelector('#itemTable tbody');
        tableBody.innerHTML = '';

        data.forEach((item, index) => {
            const newRow = document.createElement('tr');
            
            // Cột hình ảnh
            const imgCell = document.createElement('td');
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = item.name;
            img.className = 'item-img';
            img.onerror = function() {
                this.src = 'https://via.placeholder.com/50?text=Lỗi+ảnh';
            };
            imgCell.appendChild(img);

            // Cột mã hàng
            const codeCell = document.createElement('td');
            codeCell.textContent = item.code;

            // Cột tên vật phẩm
            const nameCell = document.createElement('td');
            nameCell.textContent = item.name;
            
            // Cột vị trí kệ
            const shelfCell = document.createElement('td');
            shelfCell.textContent = item.shelf;

            // Cột số lượng
            const qtyCell = document.createElement('td');
            qtyCell.textContent = item.quantity;

            newRow.appendChild(imgCell);
            newRow.appendChild(codeCell);
            newRow.appendChild(nameCell);
            newRow.appendChild(shelfCell);
            newRow.appendChild(qtyCell);

            // Chỉ thêm cột hành động xóa nếu là quản lý
            if (isAdmin) {
                const actionCell = document.createElement('td');
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Xóa';
                deleteBtn.className = 'btn-delete';
                deleteBtn.onclick = function() {
                    deleteItem(index);
                };
                actionCell.appendChild(deleteBtn);
                newRow.appendChild(actionCell);
            }
            
            tableBody.appendChild(newRow);
        });
    }

    // Hàm xử lý khi gửi form thêm vật phẩm
    document.getElementById('itemForm').addEventListener('submit', function(event) {
        event.preventDefault();
        if (!isAdmin) return;

        const code = document.getElementById('itemCode').value.trim();
        const name = document.getElementById('itemName').value.trim();
        const shelf = document.getElementById('itemShelf').value.trim();
        const quantity = document.getElementById('itemQuantity').value.trim();
        const imageFile = document.getElementById('itemImage').files[0];

        if (!code || !name || !shelf || !quantity || !imageFile) {
            alert('Vui lòng điền đầy đủ thông tin và chọn hình ảnh!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const imageBase64 = e.target.result;

            items.push({ 
                code: code, 
                name: name, 
                shelf: shelf, 
                quantity: quantity, 
                image: imageBase64 
            });

            localStorage.setItem('items', JSON.stringify(items));
            renderTable();
            document.getElementById('itemForm').reset();
        };

        reader.readAsDataURL(imageFile);
    });

    // Hàm xóa vật phẩm
    function deleteItem(index) {
        if (!isAdmin) return;
        if (confirm('Bạn có chắc chắn muốn xóa vật phẩm này không?')) {
            items.splice(index, 1);
            localStorage.setItem('items', JSON.stringify(items));
            renderTable();
        }
    }

    // Tìm kiếm
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const filteredItems = items.filter(item => 
            item.code.toLowerCase().includes(filter) ||
            item.name.toLowerCase().includes(filter) || 
            item.shelf.toLowerCase().includes(filter)
        );
        renderTable(filteredItems);
    });

    // Khởi chạy khi tải trang
    updateAuthUI();
</script>
</body>
</html>
